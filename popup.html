<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TED Transcript Tracker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="logo">🎤 TED Transcript Tracker</div>
    <span id="talk-count" class="badge">0</span>
  </header>

  <!-- Ana liste görünümü -->
  <div id="view-list">
    <!-- URL ile ekleme -->
    <div class="url-add-section">
      <div class="url-row">
        <input
          id="url-input"
          type="text"
          placeholder="TED linkini buraya yapıştır…"
          spellcheck="false"
        />
        <button id="btn-fetch-url" class="btn-fetch">Çek</button>
      </div>
      <div id="fetch-status" class="fetch-status hidden"></div>
    </div>

    <div id="empty-state" class="empty-state hidden">
      <p>Henüz kaydedilmiş konuşma yok.</p>
      <p class="hint">Yukarıya bir TED linki yapıştırın veya bir TED sayfasında <strong>"📋 Transkripti Kaydet"</strong> butonuna basın.</p>
    </div>
    <div id="talks-list"></div>
  </div>

  <!-- Transkript görüntüleme -->
  <div id="view-detail" class="hidden">
    <button id="btn-back" class="btn-back">← Geri</button>
    <h2 id="detail-title"></h2>
    <div class="detail-meta">
      <a id="detail-url" href="#" target="_blank">TED'de Aç ↗</a>
      <span id="detail-date"></span>
    </div>

    <div class="progress-section">
      <label>İlerleme: <span id="progress-val">0</span>%</label>
      <input type="range" id="progress-slider" min="0" max="100" value="0" />
    </div>

    <div class="notes-section">
      <label>Notlarım:</label>
      <textarea id="notes-area" placeholder="Bu konuşmayla ilgili notlarınızı buraya yazın..."></textarea>
      <button id="btn-save-notes" class="btn-primary">Notları Kaydet</button>
    </div>

    <div class="transcript-section">
      <h3>Transkript</h3>
      <div class="transcript-toolbar">
        <button id="btn-copy" class="btn-secondary">📋 Kopyala</button>
        <button id="btn-export" class="btn-secondary">💾 TXT İndir</button>
        <button id="btn-delete" class="btn-danger">🗑 Sil</button>
      </div>
      <div id="transcript-text"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
